# Strict type checking for the UI. Run from the repo root: mypy --config-file ui/mypy.ini
# Page files (1_Inspect.py ...) follow Streamlit's naming, so they are checked as scripts.
[mypy]
python_version = 3.12
strict = True
mypy_path = ui
explicit_package_bases = True
scripts_are_modules = True
files = ui/app.py, ui/components, ui/services, ui/pages/1_Inspect.py, ui/pages/2_Batch.py, ui/pages/3_Model.py, ui/pages/4_Explain.py
