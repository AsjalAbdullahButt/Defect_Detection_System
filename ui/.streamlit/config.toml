# Streamlit settings for the demo UI. Read from the working directory: run from ui/
# (scripts/run_ui.sh does this).

[browser]
gatherUsageStats = false          # no telemetry

[server]
headless = true
maxUploadSize = 5                 # MB per file; matches the API's DD_MAX_UPLOAD_BYTES (5 MiB)
enableXsrfProtection = true
enableCORS = true
runOnSave = false

[client]
toolbarMode = "minimal"           # no developer menu
showErrorDetails = "none"         # never show tracebacks to users
showSidebarNavigation = true

[runner]
magicEnabled = false              # explicit st.* calls only

[theme]
base = "light"
primaryColor = "#087F8C"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182C36"
font = "sans serif"
