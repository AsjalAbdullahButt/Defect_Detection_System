# All data/training hyperparameters. Validated by defect_detection.config (unknown keys fail).
seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Raw class-folder name -> class name (normal | defective). Unmapped folders fail the
  # manifest step instead of being guessed.
  class_aliases:
    def_front: defective
    ok_front: normal
  # The 512x512 release is a separate capture with no split: never trained on, evaluated
  # once in V4 as a second test set (after removing same-part copies of train/val images).
  external_test_dirs: [casting_512x512]

dedupe:
  # Near-duplicate = same physical part. Signal: Pearson correlation of standardised grayscale
  # images, maximised over the 8 rotations/flips. A 32px pass shortlists the k most similar
  # candidates per image; a 128px pass re-scores them. 64-bit pHash was tried first and
  # rejected: on this dataset almost every image is within 4 bits of another (D-031).
  # 0.99: pairs at or above it were visually verified as the same part (nicks/burrs match);
  # below ~0.98 the score also merges distinct, similar-looking normal parts.
  similarity_threshold: 0.99
  info_threshold: 0.97      # audit reports cross-split pairs above this (information only)
  coarse_size: 32
  fine_size: 128
  shortlist_k: 30            # candidates re-scored at 128px per image; 10 missed a link (audit caught it)

split:
  strategy: auto            # auto = official if the raw data has a test folder, else random
  train: 0.70               # used by the random strategy
  val: 0.15
  test: 0.15
  val_fraction_of_official_train: 0.15   # used by the official strategy

preprocess:
  # Shared by training and serving (core/preprocessing.py). Direct resize, no crop: a crop
  # could cut off a defect on the rim. ImageNet statistics, never fitted to our data.
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augment:
  # Train split only. Mild, label-preserving changes that mimic plausible capture variation.
  # No random crops or cutout: either could remove the only defective pixels and create
  # "defective" images that show no defect (label noise).
  rotation_degrees: 15
  hflip_p: 0.5
  vflip_p: 0.5
  brightness: 0.2           # ColorJitter factor range [0.8, 1.2]
  contrast: 0.2
  blur_p: 0.2
  blur_sigma: [0.1, 1.0]
  noise_p: 0.2
  noise_std: 0.02           # Gaussian noise on [0, 1] pixels
  translate: 0.05           # max shift as a fraction of image size
  scale: [0.95, 1.05]

model:
  backbone: efficientnet_b0 # alternatives: resnet18, convnext_tiny
  pretrained: true
  drop_rate: 0.2

train:
  output_dir: runs          # gitignored; one sub-folder per run
  device: auto              # cuda if available, else cpu
  batch_size: 32
  num_workers: 2
  head_epochs: 3            # stage 1: backbone frozen, classifier only
  head_lr: 1.0e-3
  finetune_epochs: 20       # stage 2: all layers, early-stopped
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 4
  class_weighting: balanced # weighted cross-entropy, weights fit on train split only

operating_point:
  # Everything here is fit on VALIDATION predictions only (never test).
  ece_bins: 15
  # Decision threshold: best precision among thresholds catching >= 99% of val defects.
  min_defect_recall: 0.99
  # Review band [low, high): below low at least 99.9% of val defects would still be caught;
  # at/above high, flagged images are defective with >= 99.5% precision.
  review_low_recall: 0.999
  review_high_precision: 0.995
  costs:                    # illustrative relative costs per image, only for the cost table
    missed_defect: 20       # faulty part reaches a customer
    false_alarm: 1          # good part scrapped or re-inspected
    review: 0.25            # a person looks at one image

evaluation:
  # Test sets (official test + external_test) are evaluated exactly ONCE with the final
  # model, temperature and threshold chosen on validation.
  bootstrap_resamples: 1000
  ci_level: 0.95
  similarity_buckets: [0.0, 0.95, 0.97, 0.98, 0.99]

anomaly:
  # PatchCore-style baseline: ImageNet features of NORMAL train images only (no defect labels).
  backbone: efficientnet_b0
  out_indices: [2, 3]       # stride-8 and stride-16 feature maps (mid-level texture)
  patches_per_image: 64     # random patch subsample per training image (keeps memory small)
  coreset_size: 5000        # greedy k-center memory bank
  projection_dim: 128       # random projection used only for coreset selection

export:
  models_dir: models        # gitignored; models/<model_version>/{model.onnx, model_meta.json, SHA256SUMS}
  opset: 17
  parity_images: 32         # VAL images compared PyTorch vs ONNX Runtime (never test)
  # np.allclose rule: |torch - onnx| <= atol + rtol * |torch logit|. Confident logits (~+-30)
  # carry ~1e-4 of float32 rounding, so a pure absolute bound would reject a correct export.
  parity_atol: 1.0e-4
  parity_rtol: 1.0e-4

benchmark:
  threads: 4                # = physical cores here; same for PyTorch and ONNX Runtime (fair)
  warmup: 10
  runs: 100
  batch_sizes: [1, 8, 32]
