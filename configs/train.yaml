# All data/training hyperparameters. Validated by defect_detection.config (unknown keys fail).
seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Raw class-folder name -> class name (normal | defective). Unmapped folders fail the
  # manifest step instead of being guessed.
  class_aliases:
    def_front: defective
    ok_front: normal

dedupe:
  # Max Hamming distance (of 64 bits) between pHashes, minimised over 8 rotations/flips, for
  # two images to count as near-duplicates. 4 = >=94% identical bits: catches re-encodes,
  # resizes and rotated/flipped copies while staying strict enough not to merge distinct parts
  # in a visually homogeneous dataset. The audit reports counts at 2x for sensitivity.
  phash_hamming_threshold: 4

split:
  strategy: auto            # auto = official if the raw data has a test folder, else random
  train: 0.70               # used by the random strategy
  val: 0.15
  test: 0.15
  val_fraction_of_official_train: 0.15   # used by the official strategy

preprocess:
  # Shared by training and serving (core/preprocessing.py). Direct resize, no crop: a crop
  # could cut off a defect on the rim. ImageNet statistics, never fitted to our data.
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augment:
  # Train split only. Mild, label-preserving changes that mimic plausible capture variation.
  # No random crops or cutout: either could remove the only defective pixels and create
  # "defective" images that show no defect (label noise).
  rotation_degrees: 15
  hflip_p: 0.5
  vflip_p: 0.5
  brightness: 0.2           # ColorJitter factor range [0.8, 1.2]
  contrast: 0.2
  blur_p: 0.2
  blur_sigma: [0.1, 1.0]
  noise_p: 0.2
  noise_std: 0.02           # Gaussian noise on [0, 1] pixels
  translate: 0.05           # max shift as a fraction of image size
  scale: [0.95, 1.05]

model:
  backbone: efficientnet_b0 # alternatives: resnet18, convnext_tiny
  pretrained: true
  drop_rate: 0.2

train:
  output_dir: runs          # gitignored; one sub-folder per run
  device: auto              # cuda if available, else cpu
  batch_size: 32
  num_workers: 2
  head_epochs: 3            # stage 1: backbone frozen, classifier only
  head_lr: 1.0e-3
  finetune_epochs: 20       # stage 2: all layers, early-stopped
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 4
  class_weighting: balanced # weighted cross-entropy, weights fit on train split only

operating_point:
  # Everything here is fit on VALIDATION predictions only (never test).
  ece_bins: 15
  # Decision threshold: best precision among thresholds catching >= 99% of val defects.
  min_defect_recall: 0.99
  # Review band [low, high): below low at least 99.9% of val defects would still be caught;
  # at/above high, flagged images are defective with >= 99.5% precision.
  review_low_recall: 0.999
  review_high_precision: 0.995
  costs:                    # illustrative relative costs per image, only for the cost table
    missed_defect: 20       # faulty part reaches a customer
    false_alarm: 1          # good part scrapped or re-inspected
    review: 0.25            # a person looks at one image
